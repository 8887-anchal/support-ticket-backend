spring.application.name=support-ticket-api
server.port=${PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3308/tickets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:ticket_app}
spring.datasource.password=${DATABASE_PASSWORD:ticket_local_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4000,https://support-ticket-management-system-drab.vercel.app}
app.bootstrap-agent.email=${BOOTSTRAP_AGENT_EMAIL:}
app.bootstrap-agent.password=${BOOTSTRAP_AGENT_PASSWORD:}
app.bootstrap-agent.name=${BOOTSTRAP_AGENT_NAME:}
